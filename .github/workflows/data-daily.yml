name: Data (daily FX)

# ECB reference rates are published around 16:00 CET on TARGET working days.
on:
  schedule:
    - cron: '30 15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  fx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fetch and validate ECB rates
        # Fails (and GitHub emails the repo owner) if validation fails; nothing is written then.
        run: python pipeline/fetch_fx.py
      - name: Commit if the data changed
        run: |
          if git diff --quiet -- src/data; then
            echo "No data change; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          git commit -m "data: ECB FX rates $(jq -r .date src/data/fx.json)"
          git pull --rebase --quiet
          git push
