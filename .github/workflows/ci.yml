name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Pipeline tests
        run: python -m unittest discover -s pipeline/tests -p 'test_*.py'
      - name: Validate committed data (rent staleness is a warning only)
        run: python pipeline/validate.py
      - run: npm ci
      - run: npm run test
      - run: npm run build
